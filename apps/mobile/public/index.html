<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#08090B" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Pocket Engineer Mission Control: brief an AI engineer, review the verified patch, ship the pull request."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Pocket Engineer · Mission Control</title>

    <!-- The `react-native-web` recommended style reset. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <style id="pocket-shell">
      html,
      body,
      #root {
        background-color: #08090b;
        color-scheme: dark;
      }
      body {
        margin: 0;
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-family: 'SpaceGrotesk-Regular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
      }
      ::selection {
        background-color: rgba(200, 247, 81, 0.26);
      }
      :focus-visible {
        outline: 2px solid #c8f751;
        outline-offset: 2px;
        border-radius: 4px;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #2c3038 transparent;
      }
      *::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      *::-webkit-scrollbar-thumb {
        background-color: #23262c;
        border-radius: 999px;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      *::-webkit-scrollbar-thumb:hover {
        background-color: #33373f;
      }
      *::-webkit-scrollbar-track {
        background: transparent;
      }

      /* First paint before the JS bundle boots: the signal mark, animating. */
      #pocket-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        background-color: #08090b;
        transition: opacity 260ms ease;
      }
      #pocket-boot span {
        width: 4px;
        height: 30px;
        border-radius: 4px;
        background-color: #c8f751;
        animation: pocket-signal 1s ease-in-out infinite;
      }
      #pocket-boot span:nth-child(1) {
        animation-delay: 0s;
      }
      #pocket-boot span:nth-child(2) {
        animation-delay: 0.12s;
      }
      #pocket-boot span:nth-child(3) {
        animation-delay: 0.24s;
      }
      #pocket-boot span:nth-child(4) {
        animation-delay: 0.36s;
      }
      #pocket-boot span:nth-child(5) {
        animation-delay: 0.48s;
      }
      #root:not(:empty) + #pocket-boot {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes pocket-signal {
        0%,
        100% {
          transform: scaleY(0.38);
          opacity: 0.55;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Pocket Engineer Mission Control.</noscript>
    <div id="root"></div>
    <div id="pocket-boot" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  </body>
</html>
