<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070C15" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Pocket Engineer Mission Control: brief an AI engineer, review the verified patch, ship the pull request."
    />
    <title>Pocket Engineer · Mission Control</title>

    <!-- The `react-native-web` recommended style reset. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <style id="pocket-shell">
      html,
      body,
      #root {
        background-color: #070c15;
        color-scheme: dark;
      }
      body {
        margin: 0;
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
      }
      ::selection {
        background-color: rgba(142, 240, 199, 0.28);
      }
      :focus-visible {
        outline: 2px solid #8ef0c7;
        outline-offset: 2px;
        border-radius: 6px;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #31435c transparent;
      }
      *::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      *::-webkit-scrollbar-thumb {
        background-color: #26364a;
        border-radius: 999px;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      *::-webkit-scrollbar-thumb:hover {
        background-color: #31435c;
      }
      *::-webkit-scrollbar-track {
        background: transparent;
      }
      /* First paint before the JS bundle boots. */
      #root:empty::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 34px;
        height: 34px;
        margin: -17px 0 0 -17px;
        border-radius: 50%;
        border: 3px solid #1f2c3e;
        border-top-color: #8ef0c7;
        animation: pocket-spin 0.9s linear infinite;
      }
      @keyframes pocket-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Pocket Engineer Mission Control.</noscript>
    <div id="root"></div>
  </body>
</html>
