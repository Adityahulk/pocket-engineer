[project]
name = "pocket-engineer-api"
version = "0.1.0"
description = "Pocket Engineer control plane and autonomous task runner"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic-settings>=2.7",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.10",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
agent = ["aider-chat>=0.86"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocket_engineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
